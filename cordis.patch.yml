# Search-only DSH bundle. The Host owns search-chain/v1 and retains the scalar
# dsh-web provider id `subscription-search` as a forwarding adapter.

- id: web
  config:
    searchProvider: subscription-search

- id: tool-web
  config:
    fetch: false
    searchTimeoutMs: 250000

- insert:
    - id: subscription-search
      name: dsh-subscription-search
